    - "assets.hardcover.app"
    - "openlibrary.org"
    - "covers.openlibrary.org"
    - "api.audible.com"
    - "m.media-amazon.com"
    - "standardebooks.org"
    - "librivox.org"
    - "archive.org"
    - "*.archive.org"
    - "gutendex.com"
    - "www.gutenberg.org"
  sources: search
  secrets:
    - hardcover_token
