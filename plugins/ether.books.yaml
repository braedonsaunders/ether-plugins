id: ether.books
name: "Books and audiobooks"
summary: "Books and audiobooks libraries from open catalogues, with free public-domain reading and listening."
description: "Adds Books and Audiobooks libraries powered by Open Library, Hardcover, Audible catalog metadata, Standard Ebooks and LibriVox, with free public-domain reading and listening plus release matching through configured sources."
kind: content
repo: https://github.com/EsmailELBoBDev2/ether-community-plugins/tree/main/books
author: Ether
license: MIT
capabilities:
  - catalog_provider
  - kind_resolver
  - matcher
  - ui
permissions:
  network:
