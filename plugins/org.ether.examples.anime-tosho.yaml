id: org.ether.examples.anime-tosho
name: "Anime Tosho"
summary: "One-click anime indexer for public torrents and Usenet NZBs, no API key needed."
description: "Searches Anime Tosho NEW (animetosho.net), an open mirror of public anime releases from Nyaa, TokyoTosho and nekoBT. Anime-aware: AniDB, MyAnimeList, Kitsu, TMDB, TVDB and IMDb IDs, absolute episode numbers and season packs. Returns torrents, NZBs (using your Usenet provider) or both."
