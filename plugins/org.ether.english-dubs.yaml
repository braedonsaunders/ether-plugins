id: org.ether.english-dubs
name: "English dubbed anime"
summary: "Anime series and films that have an English dub, for rows, collections and library rules."
description: "Lists anime with a confirmed English dub (and, optionally, dubs in progress) from the community MAL-Dubs index, fetched at runtime and mapped to TMDB, TVDB and IMDb through Fribb/anime-lists. Refreshes daily with conditional requests."
kind: extension
category: lists
